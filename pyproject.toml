[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myvoicetranslator"
version = "0.1.0"
description = "Milhy's Interview Shield - real-time STT and translation TUI"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "rich",
  "textual",
  "sounddevice",
  "faster-whisper>=1.1.0,<2.0.0",
  "fastapi",
  "uvicorn[standard]",
  "websockets",
]

[project.scripts]
myvoice = "interview_shield.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["interview_shield*"]

[tool.unittest]
start-dir = "tests"
